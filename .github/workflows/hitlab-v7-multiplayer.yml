name: Hit Lab - V7 Pass and Play
on:
  pull_request:
    branches: [main, chatgpt/v7-pass-and-play-engine, chatgpt/v7-multiplayer-integration-sprint, chatgpt/v7-unified-playtest-shell]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multiplayer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate multiplayer game engine and tests
        run: |
          node --check v7/pass-and-play.cjs
          node --check v7/pass-and-play-ui.js
          node --test tests/v7-pass-and-play.test.cjs
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve local PR files
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/hitlab-multiplayer.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/v7/multiplayer.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hitlab-multiplayer.log
          exit 1
      - name: Run multiplayer browser integration tests
        run: node --test tests/v7-multiplayer-browser.test.cjs
