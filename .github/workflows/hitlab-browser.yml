name: Hit Lab - Browser Save Tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-save:
    name: Chromium Backup and Reload
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright in CI only
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve local branch (never production)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hitlab-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hitlab-server.log
          exit 1
      - name: Run isolated browser tests
        run: node --test tests/browser-smoke.test.cjs
