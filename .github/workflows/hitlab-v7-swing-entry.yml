name: Hit Lab - V7 Mobile Swing Entry
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-swing-entry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate prototype JavaScript
        run: |
          node --check v7/swing-entry.js
          node --check tests/v7-swing-entry-browser.test.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve isolated prototype
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/hitlab-swing.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/v7/swing-entry.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hitlab-swing.log
          exit 1
      - name: Test mobile and keyboard interaction
        run: node --test tests/v7-swing-entry-browser.test.cjs
