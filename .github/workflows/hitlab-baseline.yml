name: Hit Lab - Baseline Regression Tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    name: Verify V6.3 Save Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only baseline tests
        run: node --test tests/baseline.test.cjs tests/save-migration.test.cjs tests/backup-import.test.cjs
