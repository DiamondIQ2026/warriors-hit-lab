<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hit Lab V7 — Visual Prototype</title>
<style>
:root{--red:#ed263b;--blue:#328fff;--navy:#07162e;--panel:#102849;--ink:#eaf4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#18477a,#050b19 68%);color:var(--ink);font:600 15px system-ui,Arial;min-height:100dvh}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #4484b4;border-radius:10px;background:linear-gradient(#214b77,#09162e);padding:12px}button:focus-visible{outline:3px solid #fff}.app{max-width:490px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;border-inline:1px solid #285a83}.head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#08152be8;border-bottom:2px solid var(--red)}.brand{font-weight:1000;font-style:italic;font-size:22px;letter-spacing:1px}.brand b{color:var(--red)}.brand small{font-size:11px;display:block;text-align:center;letter-spacing:4px}.page{padding:17px;flex:1}.panel{border:1px solid #3d87ba;border-radius:12px;background:linear-gradient(135deg,#153960eb,#07152de8);box-shadow:inset 0 0 20px #24548133,0 6px 18px #0005;padding:15px;margin-bottom:13px}h1{font-size:24px;text-transform:uppercase;font-style:italic;margin:8px 0 16px}h2{font-size:17px;margin:0 0 10px;text-transform:uppercase}p{color:#bdd0e3;line-height:1.5}small,.muted{color:#a9c1d7}.hero{min-height:175px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 80%,#35618b,#081327 70%);border:1px solid #4088ba;border-radius:14px;margin-bottom:16px}.hero .mark{font-size:44px;font-weight:1000;letter-spacing:-6px;color:#fff;text-shadow:3px 4px var(--red)}.primary{background:linear-gradient(#ff4257,#a00a23);border:1px solid #ff8b95;box-shadow:0 0 13px #e22a4388;font-weight:900;text-transform:uppercase}.wide{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{min-height:80px;font-weight:850;text-transform:uppercase}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:8px 5px max(8px,env(safe-area-inset-bottom));background:#071329;border-top:1px solid #3c6f9e}.nav button{padding:10px 1px;font-size:11px}.nav .on{background:linear-gradient(#dc2a43,#7e1023)}.menu{position:fixed;inset:0;background:#000a;z-index:10}.drawer{max-width:320px;background:#07182f;height:100%;padding:20px;display:flex;flex-direction:column;gap:9px}.hidden{display:none!important}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.row>*{min-width:0}.stat{font-size:25px;font-weight:950}.field{position:relative;aspect-ratio:1.2;background:radial-gradient(ellipse at 50% 70%,#276b46 0 38%,#143d30 68%,#071a29);border:3px solid #4b8aa9;border-radius:50% 50% 12px 12px;overflow:hidden}.diamond{position:absolute;left:50%;top:54%;width:37%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);border:3px solid #b99067;background:#986b4540}.fielder{position:absolute;width:15px;height:15px;transform:rotate(45deg);background:linear-gradient(135deg,#dce8f4,#426e9d);border:2px solid #8abdf5;box-shadow:0 0 9px #a4d2ff}.zones{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(3,1fr);width:43%;aspect-ratio:1;background:#07172bcf;border:2px solid #dceaff}.zones button{border-radius:0;padding:0;font-size:18px;background:#16365aa8}.zones button.chosen{background:#c61934}.score{display:grid;grid-template-columns:1fr 92px 1fr;text-align:center;align-items:center;border:2px solid #abc9dc;border-radius:8px;overflow:hidden;margin-bottom:12px}.score>div{padding:10px 2px}.score .left{background:#175184}.score .right{background:#b51d38}.score strong{display:block;font-size:31px}.score .middle{background:#eaf0f4;color:#091525;font-size:12px}.bases{font-size:22px;color:#d6a42c}.pill{border:1px solid #5589b3;border-radius:7px;padding:9px;text-align:center}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.selected{outline:2px solid #f44}.list{display:grid;gap:7px}.item{display:flex;justify-content:space-between;gap:8px;padding:11px;border:1px solid #315b82;border-radius:8px;background:#0a1b33}select,input{background:#0b213e;color:#fff;border:1px solid #4b8ebf;border-radius:7px;padding:10px;width:100%}.note{font-size:12px;color:#a9bdd2}.feedback{text-align:center;min-height:28px;color:#ffd46c;font-weight:900}.field{isolation:isolate}.field:before{content:'';position:absolute;inset:0;background:repeating-conic-gradient(from 20deg at 50% 90%,#ffffff08 0deg 12deg,transparent 12deg 24deg);pointer-events:none}.field .zones{z-index:3}.field.animating .zones{visibility:hidden}.ball{position:absolute;z-index:5;left:50%;top:80%;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 12px 5px #fff8;animation:flight .95s cubic-bezier(.16,.75,.25,1) forwards;pointer-events:none}@keyframes flight{from{transform:translate(-50%,0) scale(.6)}to{transform:translate(calc(-50% + var(--dx)),var(--dy)) scale(.35);opacity:.2}}.nav{position:sticky;bottom:0;z-index:7}.nav.gamehide{display:none}.field .diamond{background:linear-gradient(45deg,#b3845355,#c89a6955)}.score .middle{font-weight:900}.live{color:#fff7d1;font-size:12px;text-align:center;margin-bottom:10px}
/* V7 metallic broadcast scorebug and thumb-friendly swing controls */
.score{position:relative;grid-template-columns:minmax(0,1fr) 96px minmax(0,1fr);border:1px solid #dce7f4;border-radius:12px;background:linear-gradient(155deg,#cbd7e4 0%,#637c98 8%,#101f36 15%,#071327 84%,#aabed0 100%);box-shadow:0 3px 0 #020811,0 9px 22px #0009,inset 0 1px 0 #fff9;gap:2px;padding:4px}
.score>div{min-width:0;padding:9px 3px;border-radius:7px;overflow-wrap:anywhere}
.score .left{background:linear-gradient(155deg,#235d91,#0b2445 75%);box-shadow:inset 0 1px #8ec6f866}
.score .right{background:linear-gradient(155deg,#d3324a,#651126 80%);box-shadow:inset 0 1px #ffb3be66}
.score .middle{background:linear-gradient(180deg,#f8fbff,#a9bfd3);color:#061629;box-shadow:inset 0 1px #fff}
.score strong{font-size:clamp(25px,8vw,37px);line-height:1.15;font-variant-numeric:tabular-nums;text-shadow:0 2px 3px #0008}
.score .middle strong{text-shadow:none}
.score .bases{color:#b87804;text-shadow:0 1px #fff8}
#swing{min-height:58px;font-size:17px;letter-spacing:.04em;box-shadow:0 4px 0 #590817,0 8px 18px #0007}
#swing:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:380px){.score{grid-template-columns:minmax(0,1fr) 80px minmax(0,1fr)}.score>div{padding:8px 2px}.score strong{font-size:26px}}
/* Diamond-view field: readable zones, grass stripes, and a clearly defined infield */
.field{border:2px solid #7da7bc;border-radius:48% 48% 16px 16px;background:radial-gradient(ellipse at 50% 76%,#347d50 0 26%,#24633e 26% 45%,#174b36 45% 68%,#0a2730 100%);box-shadow:inset 0 0 0 3px #102d3b,inset 0 0 28px #0009,0 9px 20px #0007}
.field:before{background:repeating-conic-gradient(from -10deg at 50% 83%,#ffffff09 0deg 13deg,#00000006 13deg 26deg);opacity:.8}
.field .diamond{top:62%;width:32%;border:2px solid #e1c198;background:linear-gradient(45deg,#c59c6d80,#87634388);box-shadow:0 0 0 5px #e5cba41a}
.field .fielder{width:13px;height:13px;border:2px solid #e7f4ff;border-radius:2px;box-shadow:0 0 0 2px #102c48,0 0 10px #9dc7ff88}
.field .zones{top:48%;width:min(43%,190px);border:2px solid #e9f2ff;border-radius:7px;overflow:hidden;box-shadow:0 6px 18px #000a,0 0 0 3px #0c244499}
.field .zones button{border:1px solid #9bc4df77;background:#0d2b4ad9;min-height:38px;font-size:16px;font-weight:900;text-shadow:0 1px 3px #000}
.field .zones button.chosen{background:linear-gradient(155deg,#ff5265,#a00d28);box-shadow:inset 0 0 0 2px #ffe4e8}
.field .zones button:focus-visible{outline:3px solid #fff;outline-offset:-4px;z-index:1}
@media(max-width:380px){.field .zones button{min-height:33px;font-size:14px}}
/* Hit-result feedback and ball-flight polish */
.field{perspective:600px}
.field .ball{width:15px;height:15px;background:radial-gradient(circle at 30% 28%,#fff 0 34%,#dce5eb 65%,#a9bac6);border:1px solid #fff;box-shadow:0 0 0 2px #fff4,0 0 16px 5px #fff7;animation:flight .95s cubic-bezier(.15,.72,.22,1) forwards}
@keyframes flight{0%{transform:translate(-50%,0) scale(.75);opacity:1}55%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),var(--dy)) scale(.3);opacity:0}}
.field.animating{box-shadow:inset 0 0 0 3px #d7f3ff55,inset 0 0 30px #0008,0 0 20px #3ca0d044}
.feedback{border-radius:8px;padding:6px 4px;transition:background .2s ease}
@media(prefers-reduced-motion:reduce){.field .ball{animation-duration:.01ms}.feedback{transition:none}}
/* HitTrax-inspired simulated flight: perspective arc and landing marker (not measured tracking) */
.field .ball{offset-path:var(--flight-path);offset-rotate:0deg;left:0;top:0;animation:tracked-flight .95s ease-out forwards}
@keyframes tracked-flight{0%{offset-distance:0%;transform:scale(1);opacity:1}35%{transform:scale(.7);opacity:1}75%{transform:scale(.42);opacity:1}100%{offset-distance:100%;transform:scale(.25);opacity:0}}
.field .landing{position:absolute;z-index:4;left:var(--land-x);top:var(--land-y);width:18px;height:8px;border:2px solid #fff7b4;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 14px #ffd46c;animation:landing-pulse .95s ease-in forwards;pointer-events:none}
@keyframes landing-pulse{0%,65%{opacity:0;transform:translate(-50%,-50%) scale(.4)}80%{opacity:1}100%{opacity:.8;transform:translate(-50%,-50%) scale(1.6)}}
/* Depth cues and defensive reaction, confined to the animated play */
.field .fielder{transition:transform .18s ease-out}
.field.animating .fielder:nth-of-type(2){animation:fielder-react .95s ease-out forwards}
@keyframes fielder-react{0%,20%{transform:rotate(45deg) translate(0,0)}75%,100%{transform:rotate(45deg) translate(var(--fielder-step-x,0px),var(--fielder-step-y,0px))}}
.field .landing{animation-delay:0s}
.field .play-call{position:absolute;z-index:6;left:50%;top:8%;transform:translateX(-50%);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;padding:5px 10px;border-radius:20px;border:1px solid #ffdc78;background:#06162eea;color:#ffdc78;font-size:12px;font-weight:900;box-shadow:0 4px 14px #0008}
@media(prefers-reduced-motion:reduce){.field .ball,.field .landing{animation-duration:.01ms}}
/* Stadium Mode: original Tropicana Field-inspired environment */
.park-label{text-align:center;color:#c6e8ff;font-size:12px;font-weight:800;margin:0 0 9px}
.stadium-trop{background:radial-gradient(ellipse at 50% 88%,#2d8752 0 28%,#1c663e 29% 58%,#124c38 59% 73%,#09243a 74%);border-top:5px solid #8cabbf}
.stadium-trop .stadium-roof{position:absolute;inset:0 0 60%;border-radius:48% 48% 0 0;background:repeating-linear-gradient(12deg,#c7d6df12 0 3px,transparent 3px 23px),radial-gradient(ellipse at 50% 0%,#a9bfcc99,#33556833 72%,transparent);pointer-events:none}
.stadium-trop .outfield-wall{position:absolute;z-index:1;left:5%;right:5%;top:22%;height:15%;border-radius:52% 52% 12% 12%;border-top:5px solid #d6b762;background:linear-gradient(180deg,#123d60,#081c35);display:flex;justify-content:space-between;align-items:center;padding:0 10%;color:#f6e5ad;font-size:9px;font-weight:900;pointer-events:none}
.stadium-trop .diamond,.stadium-trop .fielder{z-index:2}
@media(max-height:740px){.page{padding:10px 14px}.hero{min-height:105px;margin:9px 0}.hero .mark{font-size:31px}.hero h1{margin:2px}.panel{padding:10px;margin-bottom:8px}.field{max-height:38dvh;aspect-ratio:1.55}h1{font-size:20px;margin:5px 0 9px}.score>div{padding:6px 2px}.score strong{font-size:25px}.nav button{padding:7px 1px}}.primary.wide{min-height:48px;margin-bottom:10px}</style>
<div class="app"><header class="head"><button id="menuButton" aria-label="Open menu">☰</button><div class="brand">TW <b>HIT LAB</b><small>V7 PROTOTYPE</small></div><button id="backButton" aria-label="Go home">⌂</button></header><main class="page" id="page"></main><nav class="nav" id="nav"></nav></div>
<div class="menu hidden" id="menu"><div class="drawer"><div class="row"><h2>Hit Lab Menu</h2><button id="closeMenu">✕</button></div><div id="menuItems" class="list"></div></div></div>
<script>
(()=>{'use strict';
const pages=['Home','Play','Season','Training','Profile','Tournament','Family Rivalry','Team Locker','Achievements','Lineup','Results'];
const storeKey='hitlab-v7-visual-prototype-only';
let state={screen:'Home',team:'Tampa Warriors',mode:'Exhibition',ballpark:'trop',innings:6,difficulty:'Veteran',zone:5,contact:'MEDIUM',outs:0,inning:1,away:0,home:0,reps:0,hits:0,log:[],rival:'Father',bases:[false,false,false],feedback:'',animating:false,trainingLog:[],gameFinished:false,finalReason:'',extraInnings:0,rivalryTurn:'away',rivalName:'Rival',homeName:'You',handoff:false,rivalryStats:{away:{reps:0,hits:0},home:{reps:0,hits:0}}};
try{const saved=JSON.parse(localStorage.getItem(storeKey)||'null');if(saved&&typeof saved==='object')state={...state,...saved,screen:'Home'}}catch{}
// Animation is transient; a refresh must never leave swings permanently locked.
state.animating=false;
const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(storeKey,JSON.stringify(state))}catch{}}
function go(s){state.screen=s;persist();render();window.scrollTo(0,0)}
function btn(label,to){return '<button data-go="'+to+'">'+label+'</button>'}
const BALLPARKS={trop:{name:'Tropicana Field',left:315,center:404,right:322}};
function selectedPark(){return BALLPARKS[state.ballpark]||BALLPARKS.trop}
function field(){const park=selectedPark();return '<div class="field stadium-trop" id="ballfield" role="group" aria-label="'+esc(park.name)+' simulated field"><div class="stadium-roof" aria-hidden="true"></div><div class="outfield-wall" aria-hidden="true"><span>315 FT</span><span>404 FT</span><span>322 FT</span></div><div class="diamond"></div>'+[[18,25],[49,14],[80,25],[33,42],[65,42],[25,60],[75,60],[49,72]].map(([x,y])=>'<i class="fielder" style="left:'+x+'%;top:'+y+'%"></i>').join('')+'<div class="zones">'+Array.from({length:9},(_,i)=>'<button data-zone="'+(i+1)+'" class="'+(state.zone===i+1?'chosen':'')+'">'+(i+1)+'</button>').join('')+'</div></div>'}
function score(){const b=Array.isArray(state.bases)?state.bases:[false,false,false];const baseIcon=i=>b[i]?'◆':'◇';return '<div class="score"><div class="left">'+esc(state.mode==='Family Rivalry'?state.rivalName:'OPPONENT')+'<strong>'+state.away+'</strong></div><div class="middle">'+(state.gameFinished?'FINAL':'▼ '+state.inning)+'<br>'+(state.gameFinished?'GAME OVER':state.outs+' OUT'+(state.outs===1?'':'S'))+'<br><span class="bases" aria-label="Bases: first '+(b[0]?'occupied':'empty')+', second '+(b[1]?'occupied':'empty')+', third '+(b[2]?'occupied':'empty')+'">'+baseIcon(2)+' '+baseIcon(1)+' '+baseIcon(0)+'</span></div><div class="right">'+esc((state.mode==='Family Rivalry'?state.homeName:state.team).toUpperCase())+'<strong>'+state.home+'</strong></div></div>'}
function home(){return '<button class="primary wide" data-go="Play">▶ PLAY BALL</button><div class="hero"><div class="mark">TW</div><h1>HIT LAB</h1><small>CHAMPIONSHIP EDITION</small></div><p class="muted">Active team: '+esc(state.team)+' · Interactive visual preview</p><div class="grid">'+[['Season','Season'],['Tournament','Tournament'],['Family Rivalry','Family Rivalry'],['Training Academy','Training'],['Team Locker','Team Locker'],['Player Profile','Profile']].map(([l,t])=>'<button class="tile" data-go="'+t+'">'+l+'</button>').join('')+'</div>'}
function play(){return '<h1>Game Setup</h1><button class="primary wide" data-go="Game">PLAY BALL ▶</button><div class="panel"><h2>Matchup</h2><div class="row"><b>'+esc(state.team)+'</b><b>VS</b><b>Stingers</b></div></div><div class="panel"><label>Ballpark<select id="ballpark"><option value="trop" selected>Tropicana Field — Dome</option></select></label><p class="note">Stadium Mode preview: simplified ballpark-inspired visuals. Additional parks planned.</p><label>Game Mode<select id="mode">'+['Exhibition','Season','Tournament','Family Rivalry'].map(x=>'<option '+(state.mode===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><div id="rivalryNames" class="panel"><h3>Family Rivalry Players</h3><label>Visiting player<input id="rivalName" maxlength="24" value="'+esc(state.rivalName)+'"></label><label>Home player<input id="homeName" maxlength="24" value="'+esc(state.homeName)+'"></label><small>Names apply when Family Rivalry mode is selected.</small></div><p>Innings</p><div class="actions">'+[3,6,9].map(n=>'<button data-innings="'+n+'" class="'+(state.innings===n?'selected':'')+'">'+n+'</button>').join('')+'</div><p>Difficulty</p><select id="difficulty">'+['Rookie','Veteran','All-Star'].map(x=>'<option '+(state.difficulty===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'}
function game(){if(state.mode==='Family Rivalry'&&state.handoff)return '<h1>PASS THE PHONE</h1>'+score()+'<div class="panel"><h2>'+esc(state.rivalryTurn==='away'?state.rivalName:state.homeName)+' — YOU ARE UP</h2><p>Hand the phone to the next batter. The previous player’s swing controls are hidden until they are ready.</p><button class="primary wide" id="readyBatter">I’M READY ▶</button></div>';return score()+'<p class="park-label">⚾ '+esc(selectedPark().name)+' · Indoor dome · Simulated flight</p><div class="panel"><div class="row"><b>ZONE '+state.zone+'</b><b>CONTACT QUALITY</b></div><div class="actions">'+['SOFT','MEDIUM','HARD'].map(x=>'<button data-contact="'+x+'" class="'+(state.contact===x?'selected':'')+'">'+x+'</button>').join('')+'</div><p class="feedback" id="feedback">'+esc(state.feedback||'Choose a zone and contact, then record your tee swing.')+'</p><button class="primary wide" id="swing">RECORD SWING ▶</button></div>'+field()+'<div class="row"><button data-go="Play">⚙ Setup</button><span>Reps '+state.reps+' · Hits '+state.hits+'</span><button data-go="Results">End Game</button></div>'}
function training(){return '<h1>Training Drill Hub</h1><div class="panel"><h2>Choose a drill</h2><div class="list">'+['Zone Precision','Barrel Control','Opposite Field','Power Challenge','Situational Hitting','Quick Hands'].map((x,i)=>'<button data-drill="'+esc(x)+'" class="row"><span>'+esc(x)+'</span><small>'+[75,60,50,80,40,30][i]+'% complete →</small></button>').join('')+'</div></div>'}
function drill(){return '<h1>'+esc(state.drill||'Zone Precision')+'</h1><div class="panel"><div class="row"><b>REPS '+state.reps+'/25</b><b>HITS '+state.hits+'</b></div></div><button class="primary wide" id="swing">RECORD REP ▶</button>'+field()+'<div class="actions">'+['SOFT','MEDIUM','HARD'].map(x=>'<button data-contact="'+x+'" class="'+(state.contact===x?'selected':'')+'">'+x+'</button>').join('')+'</div><p class="feedback" id="feedback">'+esc(state.feedback||'Select zone and record real tee contact.')+'</p><p>'+btn('View Development Report','Training Results')+'</p>'}
function report(){return '<h1>Player Development Report</h1><div class="panel"><h2>Zone Performance</h2><div class="grid">'+Array.from({length:9},(_,i)=>'<div class="pill">ZONE '+(i+1)+'<br><b>'+(state.trainingLog.filter(x=>x.zone===i+1).length?Math.round(100*state.trainingLog.filter(x=>x.zone===i+1&&x.hit).length/state.trainingLog.filter(x=>x.zone===i+1).length)+'%':'—')+'</b></div>').join('')+'</div></div><div class="panel"><h2>Key Results</h2><p>'+state.reps+' repetitions · '+state.hits+' hits</p><p>Focus next on your weakest zones. Zone percentages are calculated from recorded drill reps; zones without reps display a dash. This is not a measurement of real-world swing accuracy.</p></div>'+btn('Drill Library','Training')}
function results(){const rivalry=state.mode==='Family Rivalry';const stats=state.rivalryStats||{away:{reps:0,hits:0},home:{reps:0,hits:0}};const comparison=rivalry?'<div class="panel"><h2>Player Comparison</h2><div class="row"><b>STAT</b><b>'+esc(state.rivalName)+'</b><b>'+esc(state.homeName)+'</b></div>'+[['Runs',state.away,state.home],['Hits',stats.away.hits,stats.home.hits],['Tee Reps',stats.away.reps,stats.home.reps],['Hit Rate',stats.away.reps?Math.round(stats.away.hits/stats.away.reps*100)+'%':'—',stats.home.reps?Math.round(stats.home.hits/stats.home.reps*100)+'%':'—']].map(row=>'<div class="row"><span>'+row[0]+'</span><span>'+row[1]+'</span><span>'+row[2]+'</span></div>').join('')+'</div>':'';const tied=state.home===state.away;const won=state.home>state.away;return '<h1>Final Score</h1><div class="panel"><h2>'+esc(state.mode==='Family Rivalry'?(tied?'TIE GAME':won?state.homeName+' WINS!':state.rivalName+' WINS!'):(tied?'TIE GAME':won?'GAME COMPLETE — WIN':'GAME COMPLETE — LOSS'))+'</h2>'+score()+'<p class="muted">'+esc(state.finalReason||'Exhibition game complete.')+'</p><div class="grid"><div class="pill">INNINGS<br><b>'+(state.finalReason.startsWith('Walk-off')||state.finalReason.startsWith('Home player leads')?state.inning:state.finalReason.startsWith('Game ended')?state.inning:state.inning-1)+'</b></div><div class="pill">RECORDED HITS<br><b>'+state.hits+'</b></div><div class="pill">TEE REPS<br><b>'+state.reps+'</b></div><div class="pill">RUNS SCORED<br><b>'+state.home+'</b></div></div></div>'+comparison+'<button class="primary wide" data-go="Game">PLAY AGAIN ▶</button><p>'+btn('Back to Home','Home')+'</p>'}
function generic(){const s=state.screen;const data={'Season':['Next Game','Standings','Schedule','Team Stats'],'Tournament':['Pool Play','Bracket','Results','Stats'],'Family Rivalry':['Father vs Player','Mother vs Player','Brother vs Player','Sister vs Player'],'Team Locker':['Tampa Warriors','Stingers','Create Custom Team'],'Profile':['Career Stats','Trends','Zone Performance','Achievements'],'Achievements':['Hitting','Gameplay','Season','Special'],'Lineup':['Batting Order','Roster','Attributes','Auto Lineup'],'Results':['Final Score','Game Stats','Player Stats','XP Earned']}[s]||[];return '<h1>'+esc(s)+'</h1><div class="panel"><h2>'+esc(state.team)+'</h2><p>This is a V7 layout preview. Full game-mode logic, editing, and production saves are not yet connected.</p></div><div class="list">'+data.map(x=>'<div class="item">'+esc(x)+'<span>›</span></div>').join('')+'</div><p>'+btn('Back to Home','Home')+'</p>'}
function render(){const s=state.screen;el('page').innerHTML=s==='Home'?home():s==='Play'?play():s==='Game'?game():s==='Training'?training():s==='Drill'?drill():s==='Training Results'?report():s==='Results'?results():generic();el('nav').classList.toggle('gamehide',s==='Game'||s==='Drill');el('nav').innerHTML=['Home','Play','Season','Training','Profile'].map((x,i)=>'<button class="'+(s===x?'on':'')+'" data-go="'+x+'">'+['⌂','⚾','🏆','◎','♙'][i]+'<br>'+x+'</button>').join('');el('menuItems').innerHTML=pages.map(x=>'<button data-go="'+x+'">'+x+'</button>').join('')}
function beginGame(){state.inning=1;state.outs=0;state.away=0;state.home=0;state.reps=0;state.hits=0;state.bases=[false,false,false];state.log=[];state.feedback='';state.gameFinished=false;state.finalReason='';state.extraInnings=0;state.animating=false;state.rivalryTurn=state.mode==='Family Rivalry'?'away':'home';state.handoff=state.mode==='Family Rivalry';state.rivalryStats={away:{reps:0,hits:0},home:{reps:0,hits:0}};go('Game')}
function simulateOpponentHalf(){const chances={Rookie:.18,Veteran:.27,'All-Star':.35};const chance=chances[state.difficulty]??.27;let outs=0,runners=[false,false,false],runs=0,plateAppearances=0;while(outs<3&&plateAppearances<18&&runs<5){plateAppearances++;if(Math.random()>=chance){outs++;continue}const roll=Math.random();const n=roll<.70?1:roll<.91?2:roll<.97?3:4;const next=[false,false,false];for(let i=2;i>=0;i--)if(runners[i]){if(i+n>=3)runs++;else next[i+n]=true}if(n===4)runs++;else next[n-1]=true;runners=next}runs=Math.min(runs,5);state.away+=runs;state.log.unshift('OPPONENT: '+runs+' RUN'+(runs===1?'':'S')+' IN INNING '+state.inning);return runs}
function finishGame(reason){state.gameFinished=true;state.handoff=false;state.finalReason=reason;state.outs=Math.min(state.outs,3)}
function completeInning(){if(state.mode==='Family Rivalry'&&state.rivalryTurn==='away'){state.outs=0;state.bases=[false,false,false];if(state.inning>=state.innings&&state.home>state.away){finishGame('Home player leads after the top of the final inning.');return 0}state.rivalryTurn='home';state.feedback='SWITCH PLAYERS · HOME TEAM BATS';state.handoff=true;state.log.unshift('TOP '+state.inning+' COMPLETE · SWITCH PLAYERS');return 0}const completed=state.inning;const opponentRuns=state.mode==='Family Rivalry'?0:simulateOpponentHalf();state.rivalryTurn=state.mode==='Family Rivalry'?'away':'home';state.handoff=state.mode==='Family Rivalry';state.outs=0;state.bases=[false,false,false];state.inning++;state.feedback='INNING '+completed+' COMPLETE · OPPONENT +'+opponentRuns;if(completed>=state.innings){if(state.home===state.away){state.extraInnings++;state.feedback='TIED AFTER '+completed+' · EXTRA INNING '+state.inning;state.log.unshift('EXTRA INNING '+state.inning+' STARTS')}else finishGame('Completed '+completed+' inning'+(completed===1?'':'s')+(state.extraInnings?' including '+state.extraInnings+' extra':'')+'.')}return opponentRuns}
function advanceBases(n){if(!Number.isInteger(n)||n<1||n>4)throw new RangeError('Hit bases must be 1–4');let runs=0;const next=[false,false,false];for(let i=2;i>=0;i--)if(state.bases[i]){if(i+n>=3)runs++;else next[i+n]=true}if(n===4)runs++;else next[n-1]=true;state.bases=next;return runs}
function hitProbability(contact,zone,difficulty){const base={SOFT:.40,MEDIUM:.58,HARD:.76}[contact]??.40;const zoneBonus=zone===5?.07:[2,4,6,8].includes(zone)?.025:0;const difficultyPenalty={Rookie:0,Veteran:.04,'All-Star':.09}[difficulty]??.04;return Math.max(.15,Math.min(.88,base+zoneBonus-difficultyPenalty))}
function hitDistance(contact,roll){const power=contact==='HARD';if(power)return roll<.075?4:roll<.12?3:roll<.38?2:1;if(contact==='MEDIUM')return roll<.025?4:roll<.06?3:roll<.25?2:1;return roll<.005?4:roll<.02?3:roll<.12?2:1}
function fenceDistance(zone,park=selectedPark()){const spray=((zone-1)%3)-1;return spray<0?park.left:spray>0?park.right:park.center}
function simulatedCarry(contact,zone,baseHit){const center=zone%3===2;const baseline=baseHit===4?375:baseHit===3?310:baseHit===2?245:150;const strength=contact==='HARD'?35:contact==='SOFT'?-25:0;return Math.max(65,baseline+strength+(center?8:0))}
function parkAdjustedHit(contact,zone,baseHit){const carry=simulatedCarry(contact,zone,baseHit);const fence=fenceDistance(zone);return {bases:baseHit===4&&carry<fence?2:baseHit,carry,fence,cleared:baseHit===4&&carry>=fence}}
function swing(){const training=state.screen==='Drill';if(state.animating||(!training&&(state.gameFinished||state.handoff)))return;state.animating=true;state.reps++;if(!training&&state.mode==='Family Rivalry'){const side=state.rivalryTurn==='away'?'away':'home';if(!state.rivalryStats)state.rivalryStats={away:{reps:0,hits:0},home:{reps:0,hits:0}};state.rivalryStats[side].reps++}const power=state.contact==='HARD';const chance=hitProbability(state.contact,state.zone,state.difficulty);const hit=Math.random()<chance;let result;if(hit){state.hits++;if(!training&&state.mode==='Family Rivalry')state.rivalryStats[state.rivalryTurn].hits++;const rawBases=hitDistance(state.contact,Math.random());const adjusted=parkAdjustedHit(state.contact,state.zone,rawBases);const bases=adjusted.bases;result=['','SINGLE!','DOUBLE!','TRIPLE!','HOME RUN!'][bases];if(rawBases===4&&!adjusted.cleared)result='OFF THE WALL — DOUBLE!';if(!training){const runs=advanceBases(bases);if(state.mode==='Family Rivalry'&&state.rivalryTurn==='away')state.away+=runs;else state.home+=runs;if(state.mode==='Family Rivalry'&&state.rivalryTurn==='home'&&state.inning>=state.innings&&state.home>state.away){finishGame('Walk-off victory in the bottom of inning '+state.inning+'.')}}}else{result='BALL IN PLAY — OUT';if(!training){state.outs++;if(state.outs>=3)completeInning()}}state.feedback=result;state.log.unshift(result);if(training)state.trainingLog.push({zone:state.zone,contact:state.contact,hit});persist();const f=el('ballfield');const z=state.zone;const spray=((z-1)%3-1),lift=Math.floor((z-1)/3);const landingX=Math.max(12,Math.min(88,50+spray*(power?31:24)));const landingY=hit?(result==='HOME RUN!'?9:result==='TRIPLE!'?19:result==='DOUBLE!'?29:42):(lift===0?23:lift===1?43:65);const trajectory=lift===2?'GROUND BALL':lift===1?'LINE DRIVE':'FLY BALL';const arc=trajectory==='GROUND BALL'?4:trajectory==='LINE DRIVE'?20:(power?48:62);f.style.setProperty('--fielder-step-x',((landingX-50)*.14).toFixed(1)+'px');f.style.setProperty('--fielder-step-y',((landingY-50)*.12).toFixed(1)+'px');f.classList.add('animating');const ball=document.createElement('span');ball.className='ball';const fw=f.clientWidth||300,fh=f.clientHeight||250;const endX=(landingX-50)*fw/100,endY=(landingY-80)*fh/100;const apex=Math.min(150,fh*(arc/100));ball.style.setProperty('--flight-path','path("M 0 0 Q '+(endX*.5).toFixed(1)+' '+(endY*.5-apex).toFixed(1)+' '+endX.toFixed(1)+' '+endY.toFixed(1)+'")');ball.style.left='50%';ball.style.top='80%';f.appendChild(ball);const marker=document.createElement('span');marker.className='landing';marker.style.setProperty('--land-x',landingX+'%');marker.style.setProperty('--land-y',landingY+'%');f.appendChild(marker);const call=document.createElement('span');call.className='play-call';call.textContent=trajectory+' · '+result;f.appendChild(call);const controls=el('swing');controls.disabled=true;setTimeout(()=>{state.animating=false;if(state.screen!==(training?'Drill':'Game'))return;if(state.gameFinished&&!training){go('Results')}else{render();const msg=el('feedback');if(msg)msg.textContent=result}},1000)}
function finishTraining(){go('Training Results')}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='readyBatter'){state.handoff=false;persist();render();return}if(b.dataset.go){el('menu').classList.add('hidden');if(b.dataset.go==='Game')beginGame();else if(b.dataset.go==='Results'&&state.screen==='Game'){state.gameFinished=true;state.handoff=false;state.finalReason='Game ended early by player.';go('Results')}else go(b.dataset.go)}else if(b.dataset.zone){if(state.animating)return;state.zone=+b.dataset.zone;persist();render()}else if(b.dataset.contact){if(state.animating)return;state.contact=b.dataset.contact;persist();render()}else if(b.dataset.innings){state.innings=+b.dataset.innings;persist();render()}else if(b.dataset.drill){state.drill=b.dataset.drill;state.reps=0;state.hits=0;state.trainingLog=[];state.feedback='';go('Drill')}else if(b.id==='swing')swing()});
document.addEventListener('change',e=>{if(e.target.id==='mode')state.mode=e.target.value;if(e.target.id==='ballpark'&&BALLPARKS[e.target.value])state.ballpark=e.target.value;if(e.target.id==='difficulty')state.difficulty=e.target.value;if(e.target.id==='rivalName')state.rivalName=e.target.value.trim().slice(0,24)||'Rival';if(e.target.id==='homeName')state.homeName=e.target.value.trim().slice(0,24)||'You';persist()});
el('menuButton').onclick=()=>el('menu').classList.remove('hidden');el('closeMenu').onclick=()=>el('menu').classList.add('hidden');el('backButton').onclick=()=>go('Home');render();
})();
</script></html>
